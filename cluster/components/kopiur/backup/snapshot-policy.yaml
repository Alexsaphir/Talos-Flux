---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${PVC_NAME}
  annotations:
    kopiur.home-operations.com/allow-identity-change: 'true'
spec:
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: ${PVC_NAME}

  copyMethod: ${KOPIUR_COPYMETHOD:=Snapshot}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}

  staging:
    storageClassName: ${KOPIUR_STAGING_STORAGECLASS:=${KOPIUR_STORAGECLASS:=ceph-block}}
    accessModes:
      - ${KOPIUR_STAGING_ACCESSMODES:=${KOPIUR_ACCESSMODES:=ReadWriteOnce}}

  compression:
    compressor: zstd-fastest

  mover:
    cache:
      capacity: ${KOPIUR_CACHE_CAPACITY:=5Gi}
      mode: Persistent
      storageClassName: ${KOPIUR_CACHE_STORAGECLASS:=openebs-hostpath}
      contentCacheSizeMb: ${KOPIUR_CACHE_CONTENT_MB:=1024}
      metadataCacheSizeMb: ${KOPIUR_CACHE_METADATA_MB:=512}

    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
      runAsNonRoot: ${KOPIUR_RUN_AS_NON_ROOT:=true}
      capabilities:
        add: ${KOPIUR_CAPABILITIES_ADD:=[]}

    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1000}
      fsGroupChangePolicy: OnRootMismatch
      supplementalGroups: ${KOPIUR_SUPPLEMENTAL_GROUPS:=[]}

    privilegedMode: ${KOPIUR_PRIVILEGED_MODE:=false}

  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4

  verification:
    quick:
      schedule:
        cron: '0 4 * * *'
        jitter: 30m

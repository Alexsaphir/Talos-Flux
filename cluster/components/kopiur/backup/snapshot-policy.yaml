---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${PVC_NAME}
  annotations:
    kopiur.home-operations.com/allow-identity-change: 'true'
spec:
  compression:
    compressor: zstd

  mover:
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Persistent
      storageClassName: openebs-hostpath
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1000}
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
      runAsNonRoot: ${KOPIUR_RUNASNONROOT:=true}
    privilegedMode: ${KOPIUR_PRIVILEGEDMODE:=false}

  repository:
    kind: ClusterRepository
    name: nas

  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4

  sources:
    - pvc:
        name: ${PVC_NAME}

#  verification:
#    deep:
#      schedule:
#        cron: H 5 1 * *
#    quick:
#      schedule:
#        cron: H 3 * * *

  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}

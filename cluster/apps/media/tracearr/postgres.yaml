---
apiVersion: db.movetokube.com/v1alpha1
kind: Postgres
metadata:
  name: &app tracearr
spec:
  database: *app # db name in postgres cluster
  dropOnDelete: false
  extensions:
    - timescaledb
    - timescaledb_toolkit
---
apiVersion: db.movetokube.com/v1alpha1
kind: PostgresUser
metadata:
  name: &app tracearr

spec:
  role: *app
  database: *app # references the CR
  secretName: database
  privileges: OWNER

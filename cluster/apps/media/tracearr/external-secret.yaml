---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden

  target:
    name: tracearr-secret
    template:
      data:
        COOKIE_SECRET: '{{ .COOKIE_SECRET }}'
        JWT_SECRET: '{{ .JWT_SECRET }}'

  dataFrom:
    - extract:
        key: tracearr

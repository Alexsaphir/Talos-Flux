---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app valheim
  namespace: games
spec:
  components:
    - ../../../components/volsync
    - ../../../components/kopiur/backup

  postBuild:
    substitute:
      APP: *app
      PVC_NAME: *app
      VOLSYNC_CAPACITY: 10Gi

  prune: true
  interval: 1h
  path: cluster/apps/games/valheim
  sourceRef:
    kind: GitRepository
    name: talos-kubernetes
    namespace: flux-system

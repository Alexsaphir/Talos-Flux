---
apiVersion: authelia.milas.dev/v1alpha2
kind: OIDCClient
metadata:
  name: anchor-oidc
  annotations:
    authelia.milas.dev/oidc-provider: kube-auth/default
spec:
  description: Anchor
  public: false
  authorization_policy: two_factor
  preconfigured_consent_duration: 1m

  scopes: [ 'openid', 'groups', 'profile', 'email' ]
  redirect_uris:
    - 'https://anchor.${DOMAIN_NAME}/api/auth/oidc/callback'
    - 'anchor://oidc/callback'

  userinfo_signing_algorithm: none
  token_endpoint:
    auth_method: client_secret_post

  secret_ref:
    name: anchor-oauth-secret
    fields:
      client_id: OIDC_CLIENT_ID
      client_secret: OIDC_CLIENT_SECRET

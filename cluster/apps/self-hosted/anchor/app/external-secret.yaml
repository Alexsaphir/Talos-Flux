---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anchor-oauth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden

  target:
    name: anchor-oauth-secret
    template:
      data:
        OIDC_CLIENT_ID: '{{ .OIDC_CLIENT_ID }}'
        OIDC_CLIENT_SECRET: '{{ .OIDC_CLIENT_SECRET }}'

  dataFrom:
    - extract:
        key: anchor

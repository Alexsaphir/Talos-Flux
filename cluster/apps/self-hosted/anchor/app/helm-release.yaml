---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: anchor
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.3.0
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: anchor
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: anchor

  values:
    controllers:
      anchor:
        annotations:
          reloader.stakater.com/auto: 'true'

        containers:
          app:
            image:
              repository: ghcr.io/zhfahim/anchor
              tag: 0.18.0@sha256:434f8b2bc72e32d7027fa0259e565d7f3930cc2eca49f0c5b0b90befb5a45a77

            envFrom:
              - secretRef:
                  name: '{{ .Release.Name }}-oauth-secret'

            env:
              USER_SIGNUP: enabled
              DISABLE_INTERNAL_AUTH: true
              OIDC_ENABLED: true
              OIDC_PROVIDER_NAME: Authelia
              OIDC_ISSUER_URL: 'https://auth.${DOMAIN_NAME}'
              APP_URL: 'https://{{ .Release.Name }}.${DOMAIN_NAME}'

              PG_HOST:
                valueFrom:
                  secretKeyRef:
                    name: &secret 'database-{{ .Release.Name }}'
                    key: HOSTNAME
              PG_USER:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: LOGIN
              PG_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: PASSWORD
              PG_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: DATABASE_NAME
              PG_PORT:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: PORT


            resources:
              requests:
                cpu: 100m
                memory: 250Mi

            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ 'ALL' ] }

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        ports:
          http:
            port: 3000

    route:
      app:
        hostnames:
          - '{{ .Release.Name }}.${DOMAIN_NAME}'
        parentRefs:
          - name: envoy
            namespace: envoy-system

    configMaps:
      supervisord:
        data:
          supervisord.conf: |-
            [supervisord]
            nodaemon=true
            logfile=/dev/stdout
            logfile_maxbytes=0
            pidfile=/tmp/supervisord.pid
            loglevel=warn

            [unix_http_server]
            file=/tmp/supervisor.sock
            chmod=0700

            [supervisorctl]
            serverurl=unix:///tmp/supervisor.sock

            [rpcinterface:supervisor]
            supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

            [program:api]
            command=/usr/local/bin/node /app/server/dist/src/main
            directory=/app/server
            priority=20
            autostart=true
            autorestart=true
            stopasgroup=true
            killasgroup=true
            stopwaitsecs=1
            startsecs=5
            startretries=3
            stdout_logfile=/dev/stdout
            stdout_logfile_maxbytes=0
            stderr_logfile=/dev/stderr
            stderr_logfile_maxbytes=0
            environment=PORT="3001",DATABASE_URL="%(ENV_DATABASE_URL)s",JWT_SECRET="%(ENV_JWT_SECRET)s",NODE_ENV="production",OIDC_ENABLED="%(ENV_OIDC_ENABLED)s",OIDC_PROVIDER_NAME="%(ENV_OIDC_PROVIDER_NAME)s",OIDC_ISSUER_URL="%(ENV_OIDC_ISSUER_URL)s",OIDC_CLIENT_ID="%(ENV_OIDC_CLIENT_ID)s",OIDC_CLIENT_SECRET="%(ENV_OIDC_CLIENT_SECRET)s",DISABLE_INTERNAL_AUTH="%(ENV_DISABLE_INTERNAL_AUTH)s",APP_URL="%(ENV_APP_URL)s"

            [program:web]
            command=/bin/sh -c "until curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1; do sleep 1; done; exec /usr/local/bin/node /app/web/server.js"
            directory=/app/web
            priority=10
            autostart=true
            autorestart=true
            stopasgroup=true
            killasgroup=true
            stopwaitsecs=1
            startsecs=10
            startretries=3
            stdout_logfile=/dev/stdout
            stdout_logfile_maxbytes=0
            stderr_logfile=/dev/stderr
            stderr_logfile_maxbytes=0
            environment=PORT="3000",HOSTNAME="0.0.0.0",SERVER_URL="http://127.0.0.1:3001",NODE_ENV="production"

    persistence:
      supervisord:
        type: configMap
        identifier: supervisord
        globalMounts:
          - path: /etc/supervisord.conf
            subPath: supervisord.conf
            readOnly: true

      data:
        existingClaim: '{{ .Release.Name }}'

      tmp:
        type: emptyDir

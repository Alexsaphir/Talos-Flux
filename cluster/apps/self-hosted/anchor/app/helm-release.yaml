---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: anchor
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.3.0
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: anchor
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: anchor

  values:
    controllers:
      anchor:
        annotations:
          reloader.stakater.com/auto: 'true'

        containers:
          app:
            image:
              repository: ghcr.io/zhfahim/anchor
              tag: 0.18.0@sha256:434f8b2bc72e32d7027fa0259e565d7f3930cc2eca49f0c5b0b90befb5a45a77

            envFrom:
              - secretRef:
                  name: '{{ .Release.Name }}-oauth-secret'

            env:
              USER_SIGNUP: enabled
              DISABLE_INTERNAL_AUTH: true
              OIDC_ENABLED: true
              OIDC_PROVIDER_NAME: Authelia
              OIDC_ISSUER_URL: 'https://auth.${DOMAIN_NAME}'

              PG_HOST:
                valueFrom:
                  secretKeyRef:
                    name: &secret 'database-{{ .Release.Name }}'
                    key: HOSTNAME
              PG_USER:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: LOGIN
              PG_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: PASSWORD
              PG_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: DATABASE_NAME
              PG_PORT:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: PORT


            resources:
              requests:
                cpu: 100m
                memory: 250Mi

            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ 'ALL' ] }

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        ports:
          http:
            port: 3000

    route:
      app:
        hostnames:
          - '{{ .Release.Name }}.${DOMAIN_NAME}'
        parentRefs:
          - name: envoy
            namespace: envoy-system

    persistence:
      data:
        existingClaim: '{{ .Release.Name }}'

      tmp:
        type: emptyDir

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app anchor
  namespace: anchor
spec:
  components:
    - ../../../../components/kopiur/backup

  postBuild:
    substitute:
      PVC_NAME: *app
      KOPIUR_CAPACITY: 10Gi

  prune: true
  interval: 1h
  path: cluster/apps/self-hosted/anchor/app
  sourceRef:
    kind: GitRepository
    name: talos-kubernetes
    namespace: flux-system

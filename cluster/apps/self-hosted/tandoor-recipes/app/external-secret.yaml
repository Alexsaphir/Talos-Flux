---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tandoor-recipes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden

  target:
    name: tandoor-recipes-secret
    template:
      data:
        SECRET_KEY: '{{ .SECRET_KEY }}'
        S3_ACCESS_KEY: '{{ .S3_ACCESS_KEY }}'
        S3_SECRET_ACCESS_KEY: '{{ .S3_SECRET_ACCESS_KEY }}'
        AUTH_LDAP_BIND_PASSWORD: '{{ .AUTH_LDAP_BIND_PASSWORD }}'
        FDC_API_KEY: '{{ .FDC_API_KEY }}'

        SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"APPS":[{"provider_id": "authelia","name": "Authelia","client_id": "tandoor-recipes","secret": "{{ .OAUTH_SECRET }}","settings": {"server_url": "https://auth.${DOMAIN_NAME}/.well-known/openid-configuration"}}]}}'
  dataFrom:
    - extract:
        key: tandoor-recipes
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tandoor-recipes-oauth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden

  target:
    name: tandoor-recipes-oauth-secret
    template:
      data:
        client_id: 'tandoor-recipes'
        client_secret: '{{ .OAUTH_SECRET }}'
  dataFrom:
    - extract:
        key: tandoor-recipes

---
apiVersion: authelia.milas.dev/v1alpha2
kind: OIDCClient
metadata:
  name: tandoor-recipes
  annotations:
    authelia.milas.dev/oidc-provider: kube-auth/default
spec:
  description: tandoor-recipes
  public: false
  authorization_policy: two_factor
  preconfigured_consent_duration: 1m

  scopes: [ 'openid', 'profile', 'groups', 'email' ]
  redirect_uris: [ 'https://recipes.${DOMAIN_NAME}/accounts/oidc/authelia/login/callback/' ]

  userinfo_signing_algorithm: none
  token_endpoint:
    auth_method: client_secret_post

  secret_ref:
    name: tandoor-recipes-oauth-secret
    fields:
      client_id: client_id
      client_secret: client_secret

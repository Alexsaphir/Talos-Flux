---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: tandoor-recipes
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.3.0
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tandoor-recipes
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tandoor-recipes

  values:
    controllers:
      tandoor-recipes:
        annotations:
          reloader.stakater.com/auto: 'true'

        containers:
          app:
            image:
              repository: ghcr.io/tandoorrecipes/recipes
              tag: 2.7.1

            envFrom:
              - secretRef:
                  name: '{{ .Release.Name }}-secret'

            env:
              TZ: '${TIMEZONE}'

              TANDOOR_PORT: &port 8080

              ALLOWED_HOSTS: &host recipes.${DOMAIN_NAME}
              SESSION_COOKIE_DOMAIN: *host
              SESSION_COOKIE_NAME: tandoor-recipes-sessionid

              DB_ENGINE: django.db.backends.postgresql
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: database-tandoor-recipes
                    key: HOSTNAME
              POSTGRES_PORT: '5432'
              POSTGRES_DB:
                valueFrom:
                  secretKeyRef:
                    name: database-tandoor-recipes
                    key: DATABASE_NAME
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: database-tandoor-recipes
                    key: LOGIN
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: database-tandoor-recipes
                    key: PASSWORD

              # S3 storage
              S3_BUCKET_NAME: recipes
              S3_REGION_NAME: us-east-1
              S3_QUERYSTRING_AUTH: 1
              S3_QUERYSTRING_EXPIRE: 3600
              S3_ENDPOINT_URL: https://s3.${DOMAIN_NAME}

              DEBUG: 0
              GUNICORN_MEDIA: 0

              ENABLE_METRICS: 0
              ENABLE_PDF_EXPORT: 1

              # Users default preference
              FRACTION_PREF_DEFAULT: 1
              COMMENT_PREF_DEFAULT: 1
              SHOPPING_MIN_AUTOSYNC_INTERVAL: 5

              # Default settings for spaces
              SPACE_DEFAULT_MAX_RECIPES: 5000 # 0=unlimited recipes
              SPACE_DEFAULT_MAX_USERS: 0 # 0=unlimited users per space
              SPACE_DEFAULT_MAX_FILES: 512 # Maximum file storage for space in MB. 0 for unlimited, -1 to disable file upload.
              SPACE_DEFAULT_ALLOW_SHARING: 1 # Allow users to share recipes with public links

              SORT_TREE_BY_NAME: 1

              # Email
              EMAIL_HOST: mailpit.kube-system.svc.cluster.local
              # email sender address (default 'webmaster@localhost')
              DEFAULT_FROM_EMAIL: tandoor-recipes@domain.com


              ENABLE_SIGNUP: 1
              HIDE_LOGIN_FORM: 1
              REMOTE_USER_AUTH: 0

              # SOCIALACCOUNT_ONLY: 1
              SOCIAL_PROVIDERS: allauth.socialaccount.providers.openid_connect
              SOCIALACCOUNT_EMAIL_AUTHENTICATION: 1
              SOCIALACCOUNT_EMAIL_AUTHENTICATION_AUTO_CONNECT: 1

    defaultPodOptions:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/icon: tandoor-recipes.svg
          gethomepage.dev/name: Tandoor Recipes
          gethomepage.dev/group: Self-Hosted
          gethomepage.dev/widget.type: tandoor
          gethomepage.dev/widget.url: http://tandoor-recipes.tandoor-recipes.svc.cluster.local:8080
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_TANDOOR_API_KEY}}" }}'
          gethomepage.dev/widget.fields: '["users", "recipes"]'
        hostnames:
          - *host
        parentRefs:
          - name: envoy
            namespace: envoy-system

    persistence:
      static:
        existingClaim: '{{ .Release.Name }}'
        globalMounts:
          - path: /opt/recipes/staticfiles

      django-js-reverse:
        type: emptyDir
        globalMounts:
          - path: /opt/recipes/cookbook/static/django_js_reverse

      tmp:
        type: emptyDir

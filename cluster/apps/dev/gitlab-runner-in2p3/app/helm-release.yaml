---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gitlab-runner
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.91.0
  url: oci://ocharted.alexsaphir.com/charts.gitlab.io/gitlab-runner
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gitlab-runner
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: *app

  values:
    nameOverride: *app

    podAnnotations:
      reloader.stakater.com/auto: 'true'

    revisionHistoryLimit: 1

    gitlabUrl: https://gitlab.in2p3.fr

    # Disable registration token (deprecated)
    runnerRegistrationToken: ''

    replicas: 1

    unregisterRunners: true

    concurrent: 10
    checkInterval: 10

    logLevel: info # debug, info, warn, error, fatal, panic
    logFormat: json # runner, text, json

    rbac:
      create: true

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    service:
      enabled: true
    env:
      TZ: '${TIMEZONE}'

    extraEnv:
      CACHE_S3_SERVER_ADDRESS: s3.${DOMAIN_NAME}
      CACHE_S3_BUCKET_NAME: gitlab-runner
      CACHE_S3_BUCKET_LOCATION: us-east-1
      CACHE_SHARED: true
    extraEnvFrom:
      CACHE_S3_ACCESS_KEY:
        secretKeyRef:
          name: &s3secret gitlab-runner-s3-secret
          key: accesskey
      CACHE_S3_SECRET_KEY:
        secretKeyRef:
          name: *s3secret
          key: secretkey

    runners:
      secret: gitlab-runner-secret
      cache:
        secretName: *s3secret

      executor: kubernetes
      name: Talos

      # language=toml
      config: |
        [[runners]]
        executor = "kubernetes"
        limit = 4
        request_concurrency = 4
        environment = [
          "FF_USE_ADVANCED_POD_SPEC_CONFIGURATION=true",
        ]
        [runners.cache]
        Type = "s3"
        Shared = true
        Path = "in2p3"
        [runners.cache.s3]
        ServerAddress = "s3.alexsaphir.com"
        BucketName = "gitlab-runner"
        BucketLocation = "us-east-1"
        AuthenticationType = "access-key"
        # FF_* flags keep Kubernetes executor behavior safer and more
        # diagnosable: entrypoint parity, pod event logging, token-free Git
        # URLs, stricter Bash exit handling, script log sections, failed-cache
        # cleanup, and predictable TLS-chain behavior.
        # DOCKER_CONFIG: defense-in-depth default for Kaniko/Buildah jobs.
        # The build pod runs as uid 1000 (PSS=restricted), but the kaniko
        # image's /kaniko directory is root-owned 0755 — so writing Docker
        # auth to the default /kaniko/.docker/config.json fails with
        # `Permission denied` in step_script. /tmp is mounted as a
        # writable emptyDir on every build pod, and kaniko's executor
        # honors $DOCKER_CONFIG ahead of its /kaniko/.docker default.
        environment = [
          "FF_USE_FASTZIP=true",
          "DOCKER_CONFIG=/tmp/.docker",
          "FF_KUBERNETES_HONOR_ENTRYPOINT=true",
          "FF_PRINT_POD_EVENTS=true",
          "FF_GIT_URLS_WITHOUT_TOKENS=true",
          "FF_ENABLE_BASH_EXIT_CODE_CHECK=true",
          "FF_USE_NEW_BASH_EVAL_STRATEGY=true",
          "FF_SCRIPT_SECTIONS=true",
          "FF_CLEAN_UP_FAILED_CACHE_EXTRACT=true",
          "FF_RESOLVE_FULL_TLS_CHAIN=false",
        ]

        [runners.kubernetes]
        namespace = "{{.Release.Namespace}}"
        image = "ubuntu:22.04"
        privileged = false

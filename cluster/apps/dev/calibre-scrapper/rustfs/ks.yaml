---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rustfs
  namespace: calibre-scrapper
spec:
  components:
    - ../../../../components/kopiur/backup

  postBuild:
    substitute:
      APP: *app
      PVC_NAME: *app
      KOPIUR_CAPACITY: 30Gi

  prune: true
  interval: 1h
  path: cluster/apps/dev/calibre-scrapper/rustfs
  sourceRef:
    kind: GitRepository
    name: talos-kubernetes
    namespace: flux-system

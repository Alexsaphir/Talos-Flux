---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: EmbeddingServer
metadata:
  name: embedding
spec:
  model: sentence-transformers/all-MiniLM-L6-v2
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest@sha256:f0a4bb206b9d4877746b5b9f638e138fe683eeb9787c14d541a12c993b562d86
  env:
    - name: HOSTNAME
      value: '::'

  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1Gi

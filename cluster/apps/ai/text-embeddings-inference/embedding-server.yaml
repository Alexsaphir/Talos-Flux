---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: EmbeddingServer
metadata:
  name: embedding
spec:
  model: sentence-transformers/all-MiniLM-L6-v2
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest@sha256:b717eba54b2b66be5d43109fbdc7a0eb85a115553a0537873284472a2f2aef12
  env:
    - name: HOSTNAME
      value: '::'

  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1Gi

---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: EmbeddingServer
metadata:
  name: embedding
spec:
  model: sentence-transformers/all-MiniLM-L6-v2
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest@sha256:487b85edd882948e97a6668c3b893536cd72414cc786d02407ceab93ce6facab
  env:
    - name: HOSTNAME
      value: '::'

  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1Gi

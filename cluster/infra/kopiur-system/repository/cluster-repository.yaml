---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true

  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: nas.hosts.alexsaphir.com:9000
      region: us-east-1
      tls:
        disableTls: true

  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD

  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h

  parameters:
    epoch:
      minDuration: 1h

  scheduleDefaults:
    timezone: '${TIMEZONE}'

  server:
    auth:
      insecure:
        acknowledgeInsecure: true
    namespace: kopiur-system

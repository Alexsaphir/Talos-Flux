---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minio
  namespace: minio-system
spec:
  components:
    - ../../../components/kopiur/backup

  postBuild:
    substitute:
      PVC_NAME: minio
      KOPIUR_CAPACITY: 200Gi
      KOPIUR_PUID: '0'
      KOPIUR_PGID: '0'

  prune: true
  wait: false
  interval: 1h
  path: cluster/infra/minio-system/minio
  sourceRef:
    kind: GitRepository
    name: talos-kubernetes
    namespace: flux-system

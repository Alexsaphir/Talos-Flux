---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: minio
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.2.1
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: minio

  values:
    controllers:
      minio:
        annotations:
          reloader.stakater.com/auto: 'true'

        containers:
          app:
            image:
              repository: docker.io/pgsty/silo
              tag: RELEASE.2026-09-16T00-00-00Z

            args: [ 'server', '/data', '--console-address', ':9001' ]

            envFrom:
              - secretRef:
                  name: '{{ .Release.Name }}-secret'

            env:
              TZ: '${TIMEZONE}'

              MINIO_UPDATE: 'off'
              MINIO_API_CORS_ALLOW_ORIGIN: https://minio.${DOMAIN_NAME},https://s3.${DOMAIN_NAME}
              MINIO_BROWSER_REDIRECT_URL: https://minio.${DOMAIN_NAME}
              MINIO_SERVER_URL: https://s3.${DOMAIN_NAME}
              MINIO_DOMAIN: s3.${DOMAIN_NAME}

              MINIO_REGION_NAME: us-east-1

              MINIO_PROMETHEUS_JOB_ID: minio
              MINIO_PROMETHEUS_AUTH_TYPE: public
              MINIO_PROMETHEUS_URL: http://prometheus-operated.observability.svc.cluster.local:9090

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /minio/health/live
                    port: 9000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes

            resources:
              requests:
                memory: 100Mi
                cpu: 100m

    defaultPodOptions:
      securityContext:
        fsGroupChangePolicy: 'OnRootMismatch'
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        ports:
          http:
            port: 9001
          api:
            enabled: true
            port: 9000

    rawResources:
      no-compression:
        manifest:
          apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: BackendTrafficPolicy
          spec:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: '{{ .Release.Name }}-s3'

    route:
      app:
        hostnames: [ 'minio.${DOMAIN_NAME}' ]
        parentRefs:
          - name: envoy
            namespace: envoy-system
        rules:
          - backendRefs:
              - identifier: app
                port: 9001

      s3:
        hostnames: [ 's3.${DOMAIN_NAME}' ]
        parentRefs:
          - name: envoy
            namespace: envoy-system
        rules:
          - backendRefs:
              - identifier: app
                port: 9000


    persistence:
      config:
        existingClaim: minio
        globalMounts:
          - path: /data

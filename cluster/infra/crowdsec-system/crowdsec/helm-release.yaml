---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: crowdsec

  install:
    disableSchemaValidation: true # the chart schema rejects the kubernetes acquisition source
  upgrade:
    disableSchemaValidation: true

  values:
    container_runtime: containerd # the default (docker) mounts /var/lib/docker/containers into the agent
    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec

    lapi:
      env:
        - name: USE_WAL
          value: 'true'
        - name: ENROLL_INSTANCE_NAME
          value: 'talos-cluster'
        - name: ENROLL_TAGS
          value: 'k8s linux'

      envFrom:
        - secretRef:
            name: &secret crowdsec-secret
      podAnnotations:
        secret.reloader.stakater.com/reload: *secret
      metrics:
        serviceMonitor:
          enabled: true

    agent:
      isDeployment: true
      hostVarLog: false
      serviceAccountName: crowdsec-agent
      additionalAcquisition:
        - source: kubernetes
          namespace: crowdsec-system
          selector: gateway.envoyproxy.io/owning-gateway-name=envoy
          labels:
            type: envoy
      env:
        - name: COLLECTIONS
          value: >-
            yanis-kouidri/envoy
            crowdsecurity/base-http-scenarios
            crowdsecurity/http-cve
            crowdsecurity/plex
      metrics:
        serviceMonitor:
          enabled: true

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ServiceMonitor
              name: crowdsec-service
            patch: |-
              - op: add
                path: /spec/endpoints/0/honorLabels
                value: true

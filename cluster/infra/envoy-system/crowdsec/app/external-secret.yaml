---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden

  target:
    name: crowdsec-secret
    template:
      data:
        BOUNCER_KEY_ENVOY: '{{ .CROWDSEC_BOUNCER_KEY }}'
        ENROLL_KEY: '{{ .CROWDSEC_ENROLL_KEY }}'

  dataFrom:
    - extract:
        key: crowdsec

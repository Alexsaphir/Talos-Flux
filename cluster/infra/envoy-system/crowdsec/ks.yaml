---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec
  namespace: envoy-system
spec:
  prune: true
  interval: 1h
  path: cluster/infra/envoy-system/crowdsec/app
  sourceRef:
    kind: GitRepository
    name: talos-kubernetes
    namespace: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec-bouncer
  namespace: envoy-system
spec:
  prune: true
  interval: 1h
  path: cluster/infra/envoy-system/crowdsec/bouncer
  sourceRef:
    kind: GitRepository
    name: talos-kubernetes
    namespace: flux-system

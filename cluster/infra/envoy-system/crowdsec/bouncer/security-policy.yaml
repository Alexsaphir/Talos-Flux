---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: crowdsec-bouncer
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy

  mergeType: StrategicMerge # Used with authelia
  extAuth:
    failOpen: true
    grpc:
      backendRefs:
        - name: crowdsec-bouncer
          port: 8080

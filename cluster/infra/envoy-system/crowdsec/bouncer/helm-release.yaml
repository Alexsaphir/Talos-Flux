---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app crowdsec-bouncer
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app

  values:
    fullnameOverride: *app
    config:
      trustedProxies:
        - 10.42.0.0/16
        - fdd5:aa8:9535:42::/108

      bouncer:
        lapiURL: http://crowdsec-service:8080
        metrics: true
        apiKeySecretRef:
          name: crowdsec-secret
          key: BOUNCER_KEY_ENVOY

      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

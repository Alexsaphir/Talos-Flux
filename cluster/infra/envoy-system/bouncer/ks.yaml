---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec-bouncer
  namespace: envoy-system
spec:
  dependsOn:
    - name: gateway

  prune: true
  interval: 1h
  path: cluster/infra/envoy-system/bouncer
  sourceRef:
    kind: GitRepository
    name: talos-kubernetes
    namespace: flux-system

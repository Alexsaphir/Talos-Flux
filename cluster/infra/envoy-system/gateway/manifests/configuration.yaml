---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_envoyproxies.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: config
spec:
  logging:
    level:
      default: info

  ipFamily: DualStack

  backendTLS:
    ecdhCurves:
      - X25519
      - P-256
      - P-384

  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 3

        container:
          image: mirror.gcr.io/envoyproxy/envoy:v1.40.1

          env:
            - name: CROWDSEC_LAPI_KEY # read by the crowdsec wasm bouncer (hostKeys)
              valueFrom:
                secretKeyRef:
                  name: envoy-crowdsec-secret
                  key: BOUNCER_KEY_ENVOY

          resources:
            requests:
              cpu: 100m
            limits:
              memory: 2Gi

      envoyService:
        externalTrafficPolicy: Cluster

  # The wasm bouncer must run before authelia (ext_authz)
  filterOrder:
    - name: envoy.filters.http.wasm
      before: envoy.filters.http.ext_authz

  # Cluster used by the crowdsec wasm bouncer to reach the LAPI
  bootstrap:
    type: JSONPatch
    jsonPatches:
      - op: add
        path: /static_resources/clusters/-
        value:
          name: crowdsec_lapi
          type: STRICT_DNS
          connect_timeout: 5s
          dns_lookup_family: ALL
          load_assignment:
            cluster_name: crowdsec_lapi
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: crowdsec-service.envoy-system.svc.cluster.local
                          port_value: 8080

  shutdown:
    drainTimeout: 180s

  telemetry:
    metrics:
      prometheus:
        compression:
          type: Zstd

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-crowdsec
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden

  target:
    name: envoy-crowdsec-secret
    template:
      data:
        BOUNCER_KEY_ENVOY: '{{ .CROWDSEC_BOUNCER_KEY }}'

  dataFrom:
    - extract:
        key: crowdsec

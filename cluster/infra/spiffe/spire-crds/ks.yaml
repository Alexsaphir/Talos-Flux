---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app spire-crds
  namespace: &namespace spiffe
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace

  prune: true
  interval: 1h
  path: cluster/infra/spiffe/spire-crds
  sourceRef:
    kind: GitRepository
    name: talos-kubernetes
    namespace: flux-system

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
spec:
  # noinspection KubernetesUnknownValues
  hostnames: [ 'hubble.${DOMAIN_NAME}' ]
  parentRefs:
    - name: envoy
      namespace: envoy-system

  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80

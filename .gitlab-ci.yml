---
variables:
  FF_USE_FASTZIP: 'true'
  ARTIFACT_COMPRESSION_LEVEL: 'fast'
  CACHE_COMPRESSION_LEVEL: 'fast'

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  interruptible: true

include:
  - component: $CI_SERVER_FQDN/components/secret-detection/secret-detection@2.4.0
  - component: $CI_SERVER_FQDN/components/sast/iac-sast@3.4.0
  - component: $CI_SERVER_FQDN/components/dependency-scanning/main@2.1.1

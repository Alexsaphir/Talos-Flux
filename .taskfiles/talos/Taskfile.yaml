---
version: '3'

tasks:
  nodes:
    desc: List all nodes and their current state.
    cmd: topf nodes
    preconditions:
      - which topf sops
      - test -f {{.TALOS_DIR}}/topf.yaml

  render:
    desc: Render the machine configs to `talos/output` without applying them.
    dir: '{{.TALOS_DIR}}'
    cmd: topf render --online
    preconditions:
      - which topf sops
      - test -f {{.TALOS_DIR}}/topf.yaml

  diff:
    desc: Diff the rendered machine configs  ragainst the running cluster. [NODE=optional]
    cmd: topf apply --dry-run {{if .NODE}}--nodes-filter '^{{.NODE}}$'{{end}}
    preconditions:
      - which topf sops
      - test -f {{.TALOS_DIR}}/topf.yaml

  apply:
    desc: Apply the machine config to the cluster. [NODE=optional]
    cmd: topf apply {{if .NODE}}--nodes-filter '^{{.NODE}}$'{{end}}
    preconditions:
      - which topf sops
      - test -f {{.TALOS_DIR}}/topf.yaml

  talosconfig:
    desc: Regenerate the talosconfig.
    cmd: topf talosconfig > '{{.TALOSCONFIG}}'
    preconditions:
      - which topf sops
      - test -f {{.TALOS_DIR}}/topf-secret.sops.yaml

  kubeconfig:
    desc: Regenerate the kubeconfig.
    cmd: until topf kubeconfig > '{{.ROOT_DIR}}/kubeconfig'; do sleep 5; done
    preconditions:
      - which topf sops
      - test -f {{.TALOS_DIR}}/topf-secret.sops.yaml

  upgrade:
    desc: Upgrade Talos to the version in `topf.yaml`. [NODE=optional]
    summary: |
      Talos upgrades are normally driven in-cluster by tuppr
      (cluster/infra/system-upgrade/upgrades/talos-upgrade.yaml).
      Use this task only when the operator is unavailable.
    cmd: topf upgrade --reboot-mode powercycle {{if .NODE}}--nodes-filter '^{{.NODE}}$'{{end}}
    preconditions:
      - which topf sops
      - test -f {{.TALOS_DIR}}/topf.yaml

  upgrade-k8s:
    desc: Upgrade Kubernetes to the version in `topf.yaml`.
    summary: |
      Kubernetes upgrades are normally driven in-cluster by tuppr
      (cluster/infra/system-upgrade/upgrades/kubernetes-upgrade.yaml).
      Use this task only when the operator is unavailable.
    vars:
      KUBERNETES_VERSION:
        sh: >-
          yq '.kubernetesVersion | select(. != null)' < '{{.TALOS_DIR}}/topf.yaml'
      CONTROLLER:
        sh: talosctl config info --output json | jq --raw-output '.endpoints[0]'
    cmd: talosctl --nodes {{.CONTROLLER}} upgrade-k8s --to '{{.KUBERNETES_VERSION}}'
    preconditions:
      - which talosctl yq jq
      - test -f "${TALOSCONFIG}"
      - talosctl config info

  reset:
    desc: Resets nodes back to maintenance mode. [NODE=optional]
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf reset --full --graceful=false --wait-for-maintenance {{if .NODE}}--nodes-filter '^{{.NODE}}$'{{end}}
    preconditions:
      - which topf sops
      - test -f {{.TALOS_DIR}}/topf.yaml

  get-disks:
    desc: Get disks of a node. [IP=required]
    cmd: talosctl get disks -n {{.IP}} -o yaml | yq eval '. | select(.spec.transport == "nvme") | .spec'
    requires:
      vars: [ IP ]
    preconditions:
      - talosctl config info
      - which talosctl

  get-links:
    desc: Get network interfaces of a node. [IP=required]
    cmd: talosctl get linkstatus -n {{.IP}} -o yaml | yq eval '. | select(.spec.type == "ether")'
    requires:
      vars: [ IP ]
    preconditions:
      - talosctl config info
      - which talosctl

  get-links-up:
    desc: Get network interfaces of a node that are active. [IP=required]
    cmd: talosctl get linkstatus -n {{.IP}} -o yaml | yq eval '. | select(.spec.type == "ether") | select(.spec.linkState == "true")'
    requires:
      vars: [ IP ]
    preconditions:
      - talosctl config info
      - which talosctl

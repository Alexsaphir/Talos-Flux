---
version: '3'

vars:
  TALOS_CONTROLLER:
    sh: talosctl config info --output json | jq --raw-output '.endpoints[]' | head -n 1

tasks:
  talos:
    desc: Bootstrap the Talos cluster.
    dir: '{{.TALOS_DIR}}'
    preconditions:
      - which topf sops
      - test -f {{.SOPS_CONFIG_FILE}}
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TALOS_DIR}}/topf.yaml
    cmds:
      - # Ensure talos secrets are present.
        task: topf:secret
      - # Write a talosconfig so talosctl can reach the cluster.
        task: :talos:talosconfig
      - # Generate, apply and bootstrap. Nodes may still be booting into
        # maintenance mode, so keep retrying until they answer.
        cmd: until topf --confirm=false apply --auto-bootstrap; do sleep 10; done
      - task: :talos:kubeconfig

  kubectl:target-node:
    internal: true
    desc: Target a control plane node for the kubernetes api.
    preconditions:
      - which kubectl talosctl jq
      - test -f $KUBECONFIG
    vars:
      CLUSTER_NAME:
        sh: talosctl config info --output json | jq --raw-output '.context'
    cmd: kubectl config set-cluster {{ .CLUSTER_NAME }} --server "https://{{ .TALOS_CONTROLLER }}:6443"

  kubectl:target-cilium:
    internal: false
    desc: Target cilium vip for the kubernetes api.
    preconditions:
      - which kubectl talosctl jq
      - test -f $KUBECONFIG
      - test -f '{{.TALOS_DIR}}/topf.yaml'
    vars:
      CLUSTER_NAME:
        sh: talosctl config info --output json | jq --raw-output '.context'
      ENDPOINT:
        sh: yq '.clusterEndpoint' < '{{.TALOS_DIR}}/topf.yaml'
    cmd: kubectl config set-cluster {{ .CLUSTER_NAME }} --server "{{ .ENDPOINT }}"

  helm:critical:
    desc: Bootstrap network.
    vars:
      helm_file: '{{ .TALOS_DIR }}/bootstrap/helmfile.d/00-critical.yaml'
    env:
      INFRA_DIR: '{{ .ROOT_DIR }}/cluster/infra'
      NODE_COUNT:
        sh: talosctl config info --output json | jq --raw-output '.nodes | length'
    preconditions:
      - which sops helmfile kubectl talosctl
      - test -f {{ .helm_file }}
      - talosctl config info
    interactive: true
    cmds:
      - # Use a node as an endpoint
        task: kubectl:target-node

      - # Restore HA endpoint
        defer:
          task: kubectl:target-cilium

      - cmd: until kubectl wait nodes --for=condition=Ready=False --all --timeout=10m; do sleep 5; done
      - # Create the namespace.
        cmd: kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply -f -

      - # Apply configurations.
        cmd: 'kubectl --namespace flux-system apply --server-side --filename {{ .CLUSTER_DIR }}/{{ .ITEM }}'
        for:
          - 'components/namespace/substituteFrom/cluster-settings.yaml'

      - # Apply secrets.
        cmd: sops exec-file {{ .CLUSTER_DIR }}/{{ .ITEM }} "kubectl --namespace flux-system apply --server-side --filename {}"
        for:
          - 'infra/flux-system/flux-instance/sops-age.sops.yaml'

      - # Apply helmfile
        cmd: helmfile --file {{ .helm_file }} apply --hide-notes --skip-diff-on-install --suppress-diff --suppress-secrets

      - # Check that all nodes are ready.
        cmd: until kubectl wait nodes --for=condition=Ready=True --all --timeout=10m; do sleep 5; done

      - cmd: talosctl health -n {{ .TALOS_CONTROLLER }}

  helm:infra:
    desc: Bootstrap infra.
    vars:
      helm_file: '{{ .TALOS_DIR }}/bootstrap/helmfile.d/01-infra.yaml'
    env:
      INFRA_DIR: '{{ .ROOT_DIR }}/cluster/infra'
      NODE_COUNT:
        sh: talosctl config info --output json | jq --raw-output '.nodes | length'
    preconditions:
      - which sops helmfile kubectl talosctl
      - test -f {{ .helm_file }}
      - talosctl config info
    interactive: true
    cmds:
      - # Apply helmfile
        cmd: helmfile --file {{ .helm_file }} apply --hide-notes --skip-diff-on-install --suppress-diff --suppress-secrets

  helm:flux:
    desc: Bootstrap infra.
    vars:
      helm_file: '{{ .TALOS_DIR }}/bootstrap/helmfile.d/02-flux.yaml'
    env:
      INFRA_DIR: '{{ .ROOT_DIR }}/cluster/infra'
      NODE_COUNT:
        sh: talosctl config info --output json | jq --raw-output '.nodes | length'
    preconditions:
      - which sops helmfile kubectl talosctl
      - test -f {{ .helm_file }}
      - talosctl config info
    interactive: true
    cmds:
      - # Apply helmfile
        cmd: helmfile --file {{ .helm_file }} apply --hide-notes --skip-diff-on-install --suppress-diff --suppress-secrets


  topf:secret:
    desc: Generate the secret.
    dir: '{{.TALOS_DIR}}'
    internal: true
    run: once
    # `topf secrets` generates and SOPS-encrypts topf-secret.sops.yaml when it is missing.
    cmd: '[ -f topf-secret.sops.yaml ] || topf --confirm=false secrets > /dev/null'
    preconditions:
      - test -f {{.SOPS_CONFIG_FILE}}
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf sops

# Spegel
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: spegel
content: |-
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
  [plugins."io.containerd.cri.v1.runtime"]
    device_ownership_from_security_context = true

# NFS Mount
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: nfsmount.conf
mode: 0o644
contents: |
  [ NFSMount_Global_Options ]
  nfsvers=4.2
  hard=True
  nconnect=16
  noatime=True
  rsize=1048576
  wsize=1048576

---
apiVersion: v1alpha1
kind: FilesystemScrubConfig
interval: 168h0m0s

---
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s

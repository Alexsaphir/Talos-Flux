---
apiVersion: v1alpha1
kind: UdevRulesConfig
rules:
  # Intel GPU
  - SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660"
  # Coral Edge M.2 TPU
  - SUBSYSTEM=="apex", KERNEL=="apex*", GROUP="44", MODE="0660"
  # set owner and group on the zigbee USB device
  # - SUBSYSTEMS=="usb", ATTRS{idVendor}=="1a86", ATTRS{idProduct}=="55d4", OWNER="1022", GROUP="1022"
  # https://github.com/haraldkoch/kochhaus-home/commit/ed5b578ae9a41834c82fbc940ec03be13469ac89
  - KERNEL=="ttyACM*", MODE="0666"
